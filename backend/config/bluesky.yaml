defaults:
  sort: latest
  post_limit: 800
  reply_depth: 0
  max_replies: 10
  request_delay_seconds: 1.0

# Edit this list freely; omit the '#' prefix from tag names.
hashtag_groups:
  - tags:
      - AnimalRights
      - AnimalWelfare
    enabled: true
  - tags:
      - vegan
      - veganism
      - PlantBased
    enabled: true
  - tags:
      - FurFree
      - AnimalRescue
      - AnimalSanctuary
    enabled: true
  - tags:
      - FactoryFarming
      - EndAnimalTesting
    enabled: true
  - tags:
      - BanLiveExport
      - WildlifeConservation
      - AdoptDontShop
      - CrueltyFree
      - EndWhaling
    enabled: true
