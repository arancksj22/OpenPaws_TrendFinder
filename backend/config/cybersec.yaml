# Injection pattern blocklist for Phase 7: Cybersecurity Check.
# All patterns are treated as case-insensitive regular expressions.
# A payload is BLOCKED (not forwarded to Phase 8) when the number of
# violations found equals or exceeds max_violations_before_block.

max_violations_before_block: 3

injection_patterns:

  # --- Classic prompt-injection openers ---
  - "ignore (all )?(previous|prior|above) instructions?"
  - "disregard (all )?(previous|prior|above) (instructions?|prompts?)"
  - "forget (everything|all) (you (know|were told)|above)"
  - "override (your )?(previous )?(instructions?|system prompt|rules?)"
  - "new instructions?\\s*:"
  - "system prompt\\s*:"
  - "your (new )?(instructions?|objective|goal|task) (is|are)\\s*:"
  - "act as (if you are|though you are|a )?"
  - "you are now (a |an )?"
  - "pretend (you are|to be|that you are)"
  - "roleplay as"
  - "from now on(,| you)"
  - "do not follow"
  - "bypass (your )?(safety|filter|restriction|guideline|rule)"
  - "jailbreak"
  - "DAN mode"
  - "developer mode"
  - "unrestricted mode"
  - "STAN\\s*:"

  # --- Instruction exfiltration attempts ---
  - "repeat (the|your) (system prompt|instructions?|previous message)"
  - "what (is|are|were) your (instructions?|system prompt|rules?)"
  - "show me your (prompt|instructions?|system message)"
  - "print (the|your) (system prompt|instructions?)"
  - "reveal (your )?(system prompt|hidden instructions?)"
  - "output (your )?(initial|system) (prompt|instructions?)"

  # --- Privilege escalation patterns ---
  - "you have been granted"
  - "admin(istrator)? (mode|access|override)"
  - "sudo\\s"
  - "root access"
  - "elevated (privilege|permission|access)"
  - "unlock (all )?(capabilities|restrictions?|features?)"

  # --- Encoded / obfuscated injection signals ---
  - "base64"
  - "rot13"
  - "hex (encoded|decode)"
  - "url.?encoded"

  # --- Indirect injection via external resource references ---
  - "fetch (the )?(content|data|text) (from|at) https?://"
  - "load (instructions?|prompt) from"
  - "read (the )?(file|url|resource)"
  - "execute (the )?(following|this) (code|script|command)"
  - "run (this )?(script|command|code)"
  - "<script"
  - "javascript\\s*:"
  - "eval\\("
